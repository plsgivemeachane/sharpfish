server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Used by Docker Compose and by the Cloudflare Tunnel origin check.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # HTML and generated engine selectors must be revalidated after a rebuild.
    location ~* \.(?:html|js)$ {
        try_files $uri =404;
        add_header Cache-Control "no-cache" always;
    }

    # Branch assets keep stable filenames, so revalidate them after deployments.
    location ~* \.(?:wasm|css|svg|png|jpg|jpeg|gif|ico|woff2?)$ {
        try_files $uri =404;
        add_header Cache-Control "no-cache" always;
    }

    # Keep the browser's normal directory handling (including slash redirects)
    # while returning a useful 404 for unknown variant slugs.
    location / {
        try_files $uri $uri/ =404;
    }
}
