services:
  sharpfish:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8096:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
