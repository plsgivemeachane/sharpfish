<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Analyze a game — Sharpfish</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="analysis.css">
<link rel="stylesheet" href="badges.css">
<!-- Generated by make-web.sh. The stock engine is used for analysis. -->
<script src="engine-file.js"></script>
</head>
<body>
<header class="top"><a class="brand" href="./"><img src="favicon.svg" width="30" height="30" alt=""> <span>Sharpfish</span></a><span class="tagline">Analyze the decisions.</span></header>
<main class="analysis-layout">
  <section class="board-card" aria-label="Analysis board">
    <div class="board-head"><h1>Game analysis</h1><span id="game-title" class="muted">Paste a PGN to begin</span></div>
    <div class="board-row"><div id="evalbar" class="evalbar off" aria-label="Evaluation"><div id="evalbar-white" class="evalbar-white"></div><span id="eval-label"></span></div><div id="board" class="board" role="grid" aria-label="Position"></div></div>
    <div class="nav-row"><button id="first" class="btn" type="button" aria-label="First position">|&lt;</button><button id="prev" class="btn" type="button" aria-label="Previous move">&lt;</button><span id="position-label" class="muted">Position 0</span><button id="next" class="btn" type="button" aria-label="Next move">&gt;</button><button id="last" class="btn" type="button" aria-label="Last position">&gt;|</button></div>
  </section>
  <aside class="side">
    <section class="card import-card"><h2>Analyze PGN</h2><label for="pgn-input">Paste a game</label><textarea id="pgn-input" rows="6" placeholder="1. e4 e5 2. Nf3 Nc6"></textarea><div class="row"><button id="analyze" class="btn primary" type="button">Analyze</button><label class="file-btn btn" for="pgn-file">Open .pgn<input id="pgn-file" type="file" accept=".pgn,text/plain"></label></div><p id="error" class="error" role="alert" hidden></p></section>
    <section class="card controls"><h2>Tools</h2><label class="toggle"><input id="grade-toggle" type="checkbox"> <span>Grade every move</span></label><label class="toggle"><input id="eval-toggle" type="checkbox"> <span>Evaluation bar</span></label><div id="progress" class="progress" role="status"></div><div class="row"><button id="cancel" class="btn" type="button" disabled>Cancel</button><button id="copy" class="btn" type="button" disabled>Copy PGN</button></div></section>
    <section class="card history-card"><div class="section-head"><h2>History</h2><button id="refresh-history" class="link-btn" type="button">Refresh</button></div><p id="history-empty" class="muted">No saved games yet.</p><ul id="history-list" class="history-list"></ul></section>
    <section class="card move-card"><div class="section-head"><h2>Moves</h2><button id="next-mistake" class="link-btn" type="button" disabled>Next issue</button></div><div id="counts" class="counts muted"></div><ol id="moves" class="moves" aria-label="Analyzed moves"></ol><p id="move-detail" class="detail muted">Select a move to see its analysis.</p></section>
  </aside>
</main>
<footer class="foot"><a id="source-link" href="https://github.com/plsgivemeachane/sharpfish">Source code</a> · Stockfish analysis runs locally in your browser.</footer>
<script src="analysis-core.js"></script>
<script src="game-history.js"></script>
<script src="analysis.js"></script>
</body>
</html>
